services:
  # MySQL 5.7 数据库（唯一后端存储）
  mysql:
    image: mysql:5.7
    container_name: account-mysql
    # 不暴露端口到宿主机：仅通过容器内网访问，避免公网暴露
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须设置（至少 16 位随机串）}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-account_service}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER 必须设置}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 必须设置（至少 16 位随机串）}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - account-net

  # 应用服务
  account-service:
    build: .
    image: jacknotes/account-service:latest
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - GIN_MODE=release
      - TZ=Asia/Shanghai
      - MYSQL_DSN=${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE:-account_service}?parseTime=true&charset=utf8mb4&loc=Local
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET 必须设置，至少 32 位随机字符串}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      # 若本服务前面还有反代，把反代 IP 填进这里（逗号分隔），否则限流会按反代 IP 计数
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - account-net

volumes:
  mysql_data:
    driver: local

networks:
  account-net:
    driver: bridge
