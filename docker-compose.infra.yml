# 基础设施服务 - 本地开发使用（仅开发环境！）
# 启动命令: docker compose -f docker-compose.infra.yml up -d
# 注意：本文件暴露端口到宿主机并使用固定弱口令，仅供本地开发，切勿用于生产。

services:
  mysql:
    image: mysql:5.7
    container_name: account-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: account_service
      MYSQL_USER: ${MYSQL_USER:-account}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-account123456}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
